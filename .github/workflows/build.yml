# Builds the patch on GitHub's Windows runners and publishes the DLL.
#
# A binary built by a public runner from public source, with a public log, is
# far easier for a suspicious player -- or an antivirus vendor handling a
# false-positive report -- to trust than one uploaded from a personal machine.
#
# Runs on every push. Pushing a tag like v0.3.0.1 also attaches d3d9.dll to a
# GitHub Release.

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # No MSVC setup action needed: build.cmd finds Visual Studio via vswhere
      # and calls vcvarsall itself, exactly as it does locally. That keeps one
      # copy of the build commands and one less third-party action in the chain.
      - name: Build
        shell: cmd
        run: build.cmd

      - name: Report hash and metadata
        shell: pwsh
        run: |
          $dll = "build/d3d9.dll"
          $h   = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          $len = (Get-Item $dll).Length
          Write-Host "SHA256 : $h"
          Write-Host "Size   : $len bytes"
          $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          $vi | Select-Object FileDescription, ProductName, FileVersion, CompanyName, LegalCopyright | Format-List
          # a blank FileVersion means the version resource failed to embed
          if ([string]::IsNullOrEmpty($vi.FileVersion)) { throw "version resource missing" }
          "### Build output`n`nSHA-256: ``$h```n`n$len bytes" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: d3d9-dll
          path: build/d3d9.dll
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/d3d9.dll
          generate_release_notes: true
